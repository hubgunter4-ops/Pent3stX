# Política OWASP Top 10:2025 para pentestx.py.
# Solo checks read-only con GET/HEAD; no payloads ni métodos mutantes.
profiles:
  owasp_a01_access_control:
    owasp_version: "2025"
    checks: [A01]
    rate_limit: 2
    timeout: 10
    max_urls: 10
    max_requests: 20
    methods: [GET]
    follow_redirects: false
    body_limit: 32768

  owasp_a02_misconfiguration:
    owasp_version: "2025"
    checks: [A02]
    rate_limit: 3
    timeout: 10
    max_urls: 20
    max_requests: 40
    methods: [HEAD, GET]
    follow_redirects: false
    body_limit: 16384


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar módulos
        run: python3 -m py_compile pentestx.py pentestx_gui.py pentestx_controlled.py telemetry_sender.py
      - name: Tests (solo mocks y dry-run, sin herramientas externas)
        run: python3 -m unittest discover -s tests -v
